# Monitoring stack for the 8byte platform. Runs on the `mon` host (10.0.10.20).
# Started by scripts/bootstrap/mon.sh:
#   docker compose -f /opt/8byte/repo/monitoring/docker-compose.yml --env-file /opt/8byte/repo/monitoring/.env up -d
#
# Ports bind on 0.0.0.0 on purpose: the mon security group only admits 22 from
# management and 3100 from backend (Loki push). Grafana/Prometheus/Alertmanager
# are reached through an SSH tunnel via the management host (see README.md).
# Every image tag is pinned.

name: 8byte-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - postgres_exporter
    labels:
      env: monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "0.0.0.0:9093:9093"
    volumes:
      # Rendered from alertmanager.yml.tpl by scripts/bootstrap/mon.sh (envsubst).
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    labels:
      env: monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    labels:
      env: monitoring

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "0.0.0.0:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    labels:
      env: monitoring

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_DSN}
    ports:
      - "0.0.0.0:9187:9187"
    labels:
      env: monitoring

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
