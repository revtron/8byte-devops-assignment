# PostgreSQL (RDS via postgres_exporter 0.15) alerts (spec section 7.4).
# Severity scheme: critical = would page an on-call (service/host down, users affected);
# warning = email only, look at it during working hours.
groups:
  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0 or absent(pg_up)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "postgres_exporter cannot connect to the RDS instance (pg_up == 0 or metric missing) for 2 minutes."

      - alert: PostgresTooManyConnections
        expr: |
          (
            sum(pg_stat_activity_count) / max(pg_settings_max_connections)
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80% of max_connections"
          description: "{{ $value | printf \"%.1f\" }}% of max_connections are in use for 5 minutes."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks{datname=~"todo_.*"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Deadlocks detected in {{ $labels.datname }}"
          description: "{{ $value | printf \"%.0f\" }} deadlock(s) in database {{ $labels.datname }} in the last 5 minutes."
