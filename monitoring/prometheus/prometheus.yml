# Prometheus configuration for the 8byte platform (runs on the mon host).
#
# Target IPs are FIXED BY CONTRACT (.superpowers/sdd/tracks/contracts.md):
#   backend = 10.0.10.10, mon = 10.0.10.20 (private subnet a, 10.0.10.0/24).
# Terraform assigns these static private IPs, so there is no service discovery
# and no dependency cycle between the hosts.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 8byte
    replica: mon

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter runs as a systemd service (:9100) on each EC2 host
  # (installed by scripts/install-node-exporter.sh).
  - job_name: node
    static_configs:
      - targets: ["10.0.10.10:9100"]
        labels:
          host: backend
      - targets: ["10.0.10.20:9100"]
        labels:
          host: mon

  # Todo application containers on the backend host.
  # prod  -> host port 3000, staging -> host port 3001 (deploy contract).
  - job_name: todo-app
    metrics_path: /metrics
    static_configs:
      - targets: ["10.0.10.10:3000"]
        labels:
          env: prod
      - targets: ["10.0.10.10:3001"]
        labels:
          env: staging

  # postgres_exporter (compose service) -> RDS.
  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # Loki self-metrics.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Alertmanager self-metrics.
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
